name: Audit maintenance

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: audit-maintenance
  cancel-in-progress: false

jobs:
  point1:
    if: github.actor == 'jordyloeuille' && github.event.issue.title == 'Apply audit point 1 global dispatch fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/global-dispatch-detection
          fetch-depth: 0
      - name: Apply source and regression fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/Analysis/SourceScanner.php')
          text = source.read_text()
          old = """                $metadata = $this->classIndex->metadata($resolved);\n                $method = $this->captured($match, 'method');\n                $statement = $this->statementAt($offset);\n                $looksLikeJob = $metadata?->queued() === true\n                    || str_contains(strtolower($resolved), '\\\\jobs\\\\')\n                    || preg_match('/\\\\\\\\Jobs\\\\\\\\/', $resolved) === 1;\n"""
          new = """                $metadata = $this->classIndex->metadata($resolved);\n                $method = $this->captured($match, 'method');\n                $statement = $this->statementAt($offset);\n                $globalDispatchHelper = preg_match('/(?<![A-Za-z0-9_>])(?<!->)\\\\\\\\?dispatch\\\\s*\\\\(\\\\s*new\\\\s+/i', $statement) === 1;\n                $looksLikeJob = $globalDispatchHelper\n                    || $metadata?->queued() === true\n                    || str_contains(strtolower($resolved), '\\\\jobs\\\\')\n                    || preg_match('/\\\\\\\\Jobs\\\\\\\\/', $resolved) === 1;\n"""
          if old not in text and '$globalDispatchHelper' not in text:
              raise SystemExit('dispatch block not found')
          if old in text:
              source.write_text(text.replace(old, new, 1))
          matrix = Path('tests/Support/ScenarioMatrix.php')
          text = matrix.read_text()
          marker = "    'fully qualified DB and Http facades are detected' => [\n"
          scenario = r'''    'global dispatch helper detects job outside Jobs namespace' => [
        'code' => <<<'PHP'
<?php
namespace App\Work;
use Illuminate\Support\Facades\DB;
class RecalculateOrder {}
DB::transaction(function () { dispatch(new RecalculateOrder()); });
PHP,
        'rules' => ['TG001'],
    ],
    'global dispatch helper outside Jobs namespace is safe after commit' => [
        'code' => <<<'PHP'
<?php
namespace App\Work;
use Illuminate\Support\Facades\DB;
class RecalculateOrder {}
DB::transaction(function () { dispatch(new RecalculateOrder())->afterCommit(); });
PHP,
        'rules' => [],
        'absent' => ['TG001'],
    ],
'''
          if 'global dispatch helper detects job outside Jobs namespace' not in text:
              if marker not in text:
                  raise SystemExit('scenario marker not found')
              matrix.write_text(text.replace(marker, scenario + marker, 1))
          PY
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - run: composer format
      - run: composer test:smoke
      - run: composer test
      - run: composer analyse
      - name: Commit validated point 1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          git add src/Analysis/SourceScanner.php tests/Support/ScenarioMatrix.php .github/workflows/tests.yml
          git commit -m 'fix: detect global dispatch outside Jobs namespaces'
          git push origin HEAD:fix/global-dispatch-detection

  point2:
    if: github.actor == 'jordyloeuille' && github.event.issue.title == 'Apply audit point 2 remove PHPStan exceptions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/phpstan-max-zero-ignores
          fetch-depth: 0
      - name: Refactor analyzer inference points
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          meta = Path('src/Analysis/ClassMetadataIndex.php')
          text = meta.read_text()
          sig = '    private function queueNameFor(string $class, array $seen = []): ?string\n'
          doc = '    /** @param  array<string, true>  $seen */\n'
          if doc + sig not in text:
              if sig not in text: raise SystemExit('queueNameFor not found')
              text = text.replace(sig, doc + sig, 1)
          meta.write_text(text)

          src = Path('src/Analysis/SourceScanner.php')
          text = src.read_text()
          start = text.index('    private function scanNotifications')
          end = text.index('    private function scanBroadcasts', start)
          section = text[start:end].replace('$metadata?->queueAfterCommit()', '$metadata->queueAfterCommit()', 1)
          text = text[:start] + section + text[end:]
          old = '''            $flush = function () use (&$regions, &$groupStart, &$groupEnd, &$depth): void {
                if ($groupStart === null) {
                    return;
                }

                $end = $groupEnd ?? strlen($this->source);
                $regions[] = [
                    'start' => $groupStart['end'],
                    'end' => $end,
                    'line' => $this->lineAtOffset($groupStart['offset']),
                    'type' => 'manual',
                    'attempts' => 1,
                    'connection' => $groupStart['connection'],
                    'callableStart' => $groupStart['end'],
                    'callableEnd' => $end,
                ];

                $groupStart = null;
                $groupEnd = null;
                $depth = 0;
            };
'''
          new = '''            /** @param DatabaseControlCall|null $start */
            $flush = function (?array $start, ?int $endOffset) use (&$regions): void {
                if ($start === null) {
                    return;
                }

                $end = $endOffset ?? strlen($this->source);
                $regions[] = [
                    'start' => $start['end'],
                    'end' => $end,
                    'line' => $this->lineAtOffset($start['offset']),
                    'type' => 'manual',
                    'attempts' => 1,
                    'connection' => $start['connection'],
                    'callableStart' => $start['end'],
                    'callableEnd' => $end,
                ];
            };
'''
          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace("                        $flush();\n                    }\n                    if ($groupStart === null) {", "                        $flush($groupStart, $groupEnd);\n                        $groupStart = null;\n                        $groupEnd = null;\n                        $depth = 0;\n                    }\n                    if ($groupStart === null) {", 1)
              text = text.replace("            $flush();\n        }\n\n        return $regions;", "            $flush($groupStart, $groupEnd);\n        }\n\n        return $regions;", 1)
          oldcap = '''        $value = $match['matches'][$name] ?? '';
        if (is_array($value)) {
            return (string) $value[0];
        }

        return (string) $value;
'''
          newcap = '''        $value = $match['matches'][$name] ?? '';
        if (is_array($value)) {
            $captured = $value[0] ?? '';

            return is_string($captured) ? $captured : '';
        }

        return is_string($value) ? $value : '';
'''
          if oldcap not in text: raise SystemExit('captured helper not found')
          text = text.replace(oldcap, newcap, 1)
          src.write_text(text)

          neon = Path('phpstan.neon')
          neon.write_text("""includes:\n    - vendor/larastan/larastan/extension.neon\n\nparameters:\n    level: max\n    paths:\n        - src\n    tmpDir: .phpstan-cache\n    reportUnmatchedIgnoredErrors: true\n""")
          PY
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - run: composer format
      - run: composer test:smoke
      - run: composer test
      - run: composer analyse
      - name: Commit validated point 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Analysis/ClassMetadataIndex.php src/Analysis/SourceScanner.php phpstan.neon
          git commit -m 'refactor: eliminate PHPStan analyzer exceptions'
          git push origin HEAD:refactor/phpstan-max-zero-ignores

  point3:
    if: github.actor == 'jordyloeuille' && github.event.issue.title == 'Apply audit point 3 transaction fast path'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/no-transaction-fast-path
          fetch-depth: 0
      - name: Add no-transaction fast path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/Analysis/SourceScanner.php')
          text = src.read_text()
          old = "        $this->transactions = array_merge($this->findClosureTransactions(), $this->findManualTransactions());\n        $this->afterCommitCallbacks = $this->findAfterCommitCallbacks();\n"
          new = "        $this->transactions = array_merge($this->findClosureTransactions(), $this->findManualTransactions());\n        if ($this->transactions === []) {\n            return [];\n        }\n\n        $this->afterCommitCallbacks = $this->findAfterCommitCallbacks();\n"
          if old not in text: raise SystemExit('transaction discovery block not found')
          src.write_text(text.replace(old, new, 1))
          PY
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - run: composer format
      - run: composer test:smoke
      - run: composer test
      - run: composer analyse
      - name: Commit validated point 3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Analysis/SourceScanner.php
          git commit -m 'perf: skip side-effect scans without transactions'
          git push origin HEAD:perf/no-transaction-fast-path

  point4:
    if: github.actor == 'jordyloeuille' && github.event.issue.title == 'Apply audit point 4 strict baseline schema'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/strict-baseline-schema
          fetch-depth: 0
      - name: Harden baseline loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Analysis/Baseline.php')
          text = p.read_text()
          old = '''        $decoded = json_decode($json, true, 512, JSON_THROW_ON_ERROR);
        if (! is_array($decoded)) {
            return new self;
        }

        $fingerprintValue = $decoded['fingerprints'] ?? null;
        $fingerprints = is_array($fingerprintValue) ? $fingerprintValue : [];

        return new self(array_values(array_filter($fingerprints, 'is_string')));
'''
          new = '''        $decoded = json_decode($json, true, 512, JSON_THROW_ON_ERROR);
        if (! is_array($decoded)) {
            throw new \\RuntimeException("Invalid Transaction Guard baseline [{$path}]: expected a JSON object.");
        }

        $version = $decoded['version'] ?? null;
        if ($version !== 1) {
            throw new \\RuntimeException("Invalid Transaction Guard baseline [{$path}]: unsupported or missing version.");
        }

        $fingerprints = $decoded['fingerprints'] ?? null;
        if (! is_array($fingerprints)) {
            throw new \\RuntimeException("Invalid Transaction Guard baseline [{$path}]: fingerprints must be an array.");
        }

        foreach ($fingerprints as $fingerprint) {
            if (! is_string($fingerprint) || $fingerprint === '') {
                throw new \\RuntimeException("Invalid Transaction Guard baseline [{$path}]: every fingerprint must be a non-empty string.");
            }
        }

        return new self(array_values($fingerprints));
'''
          if old not in text: raise SystemExit('baseline load block not found')
          p.write_text(text.replace(old, new, 1))

          t = Path('tests/Unit/BaselineTest.php')
          text = t.read_text()
          if "rejects structurally invalid baselines" not in text:
              text += '''\n\nit('rejects structurally invalid baselines', function (string $json): void {\n    $path = sys_get_temp_dir().'/invalid-transaction-guard-baseline-'.bin2hex(random_bytes(4)).'.json';\n\n    try {\n        file_put_contents($path, $json);\n        expect(fn () => Baseline::load($path))->toThrow(RuntimeException::class);\n    } finally {\n        @unlink($path);\n    }\n})->with([\n    'null root' => 'null',\n    'missing version' => '{"fingerprints":[]}',\n    'wrong version' => '{"version":2,"fingerprints":[]}',\n    'fingerprints not array' => '{"version":1,"fingerprints":"oops"}',\n    'non-string fingerprint' => '{"version":1,"fingerprints":[123]}',\n    'empty fingerprint' => '{"version":1,"fingerprints":[""]}',\n]);\n'''
          t.write_text(text)
          PY
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - run: composer format
      - run: composer test:smoke
      - run: composer test
      - run: composer analyse
      - name: Commit validated point 4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Analysis/Baseline.php tests/Unit/BaselineTest.php
          git commit -m 'fix: validate baseline schema strictly'
          git push origin HEAD:fix/strict-baseline-schema
