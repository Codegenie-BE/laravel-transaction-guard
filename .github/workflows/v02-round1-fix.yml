name: V0.2 regression fixer

on:
  push:
    branches:
      - feature/v0.2-analyzer-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/v0.2-analyzer-hardening
          fetch-depth: 0

      - name: Apply regression fixes
        run: python3 .github/v02-round1-fix.py

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Format
        run: composer format

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src tests docs composer.json phpstan.neon tools README.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix: correct v0.2 analyzer edge cases'
            git push origin HEAD:feature/v0.2-analyzer-hardening
          fi

      - name: Run smoke matrix
        run: composer test:smoke

      - name: Run PHPStan
        run: composer analyse
