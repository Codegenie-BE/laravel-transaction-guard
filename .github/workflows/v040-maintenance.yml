name: v0.4.0 hardening maintenance

on:
  push:
    branches:
      - release/v0.4.0-hardening

permissions:
  contents: write

concurrency:
  group: v040-hardening
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    if: github.event.head_commit.message == 'chore: trigger v0.4.0 hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.4.0-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Apply v0.4.0 patch
        run: python3 tools/v040_patch.py

      - name: Lint PHP source
        run: find src tests tools -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Format
        run: composer format

      - name: Run complete quality gate
        run: composer check:all

      - name: Enforce coverage
        run: composer test:coverage

      - name: Commit validated v0.4.0 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/v040-maintenance.yml'
          if git diff --cached --quiet; then
            echo 'No validated source changes to commit.'
          else
            git commit -m 'release: v0.4.0 transaction lifecycle hardening'
            git push origin HEAD:release/v0.4.0-hardening
          fi
