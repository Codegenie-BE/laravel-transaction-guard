name: v0.4.0 hardening maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: v040-hardening
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/v0.4.0-hardening' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.4.0-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Apply and validate v0.4.0
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/v040_runner.py &&
            find src tests tools -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null &&
            composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress &&
            composer format &&
            composer check:all &&
            composer test:coverage
          } 2>&1 | tee /tmp/v040-validation.log

      - name: Commit validation result
        if: always()
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${GATE_OUTCOME}" != "success" ]; then
            git reset --hard HEAD
            tail -n 300 /tmp/v040-validation.log > .v040-status
            git add .v040-status
            git commit -m 'chore: record v0.4.0 validation failure'
            git push origin HEAD:release/v0.4.0-hardening
            exit 1
          fi

          rm -f .v040-status
          git add -A -- . ':!.github/workflows/v040-maintenance.yml'
          if git diff --cached --quiet; then
            echo 'No validated source changes to commit.'
          else
            git commit -m 'release: v0.4.0 transaction lifecycle hardening'
            git push origin HEAD:release/v0.4.0-hardening
          fi
