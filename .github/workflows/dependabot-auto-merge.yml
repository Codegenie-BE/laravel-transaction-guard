name: Dependabot merge after Tests

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  mark-safe:
    name: Mark safe Dependabot update
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Mark patch/minor Actions or direct development updates
        if: >-
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          ) &&
          (
            steps.metadata.outputs.package-ecosystem == 'github-actions' ||
            steps.metadata.outputs.dependency-type == 'direct:development'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label dependencies-automerge

  merge-safe:
    name: Squash safe Dependabot update after Tests
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested head and merge Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          login="$(jq -r '.user.login' <<< "${pr}")"
          draft="$(jq -r '.draft' <<< "${pr}")"
          state="$(jq -r '.state' <<< "${pr}")"
          current_head_sha="$(jq -r '.head.sha' <<< "${pr}")"

          if [ "${login}" != 'dependabot[bot]' ] || [ "${draft}" != 'false' ] || [ "${state}" != 'open' ]; then
            echo 'Workflow run is not for an open, ready Dependabot PR; skipping.'
            exit 0
          fi

          if [ "${current_head_sha}" != "${TESTED_HEAD_SHA}" ]; then
            echo "Dependabot PR head moved from tested ${TESTED_HEAD_SHA} to ${current_head_sha}; waiting for Tests on the current head."
            exit 0
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' | grep -Fx 'dependencies-automerge' >/dev/null; then
            echo 'Dependabot PR is not marked for safe automatic merge; skipping.'
            exit 0
          fi

          gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --squash --match-head-commit "${TESTED_HEAD_SHA}"
