name: Apply release quality fixes

on:
  push:
    branches:
      - feature/full-package
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/full-package

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Apply type-safety fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'src/Analysis/ClassMetadataIndex.php',
              '    /** @param array<string, true> $seen @return list<string> */\n',
              '    /**\n     * @param  array<string, true>  $seen\n     * @return  list<string>\n     */\n',
          )
          replace(
              'src/Analysis/Finding.php',
              "        if (is_string($cwd) && $cwd !== '') {\n",
              "        if (is_string($cwd)) {\n",
          )
          replace(
              'src/Analysis/SourceScanner.php',
              '|| $metadata?->queueAfterCommit() === true ||',
              '|| $metadata->queueAfterCommit() === true ||',
          )
          replace(
              'src/Analysis/SourceScanner.php',
              '''        $flush = function () use (&$regions, &$groupStart, &$groupEnd, &$depth): void {
            if ($groupStart === null) {
                return;
            }

            $end = $groupEnd ?? strlen($this->source);
            $regions[] = [
                'start' => $groupStart['end'],
                'end' => $end,
                'line' => $this->lineAtOffset($groupStart['offset']),
                'type' => 'manual',
                'attempts' => 1,
                'callableStart' => $groupStart['end'],
                'callableEnd' => $end,
            ];

            $groupStart = null;
            $groupEnd = null;
            $depth = 0;
        };
''',
              '''        /** @param array{type:string,offset:int,end:int,scope:string}|null $start */
        $flush = function (?array $start, ?int $endOffset) use (&$regions): void {
            if ($start === null) {
                return;
            }

            $end = $endOffset ?? strlen($this->source);
            $regions[] = [
                'start' => $start['end'],
                'end' => $end,
                'line' => $this->lineAtOffset($start['offset']),
                'type' => 'manual',
                'attempts' => 1,
                'callableStart' => $start['end'],
                'callableEnd' => $end,
            ];
        };
''',
          )
          replace(
              'src/Analysis/SourceScanner.php',
              '''            if ($groupStart !== null && $call['scope'] !== $groupStart['scope']) {
                $flush();
            }
''',
              '''            if ($groupStart !== null && $call['scope'] !== $groupStart['scope']) {
                $flush($groupStart, $groupEnd);
                $groupStart = null;
                $groupEnd = null;
                $depth = 0;
            }
''',
          )
          replace(
              'src/Analysis/SourceScanner.php',
              '''                if ($groupStart !== null && $depth === 0) {
                    $flush();
                }
''',
              '''                if ($groupStart !== null && $depth === 0) {
                    $flush($groupStart, $groupEnd);
                    $groupStart = null;
                    $groupEnd = null;
                    $depth = 0;
                }
''',
          )
          replace(
              'src/Analysis/SourceScanner.php',
              '        $flush();\n\n        return $regions;\n',
              '        $flush($groupStart, $groupEnd);\n\n        return $regions;\n',
          )
          replace(
              'src/Analysis/SourceScanner.php',
              '    /** @param list<Finding> $findings */\n    private function appendFinding(\n',
              '    /**\n     * @param  list<Finding>  $findings\n     * @param  array<string, scalar|null>  $context\n     */\n    private function appendFinding(\n',
          )
          replace(
              'src/Analysis/SourceScanner.php',
              '    /** @param list<Finding> $findings @param array{attempts:int,type:string} $tx */\n    private function appendRetryFinding(',
              '    /**\n     * @param  list<Finding>  $findings\n     * @param  array{attempts:int,type:string}  $tx\n     */\n    private function appendRetryFinding(',
          )
          replace(
              'src/Console/TransactionGuardCommand.php',
              "        $format = strtolower((string) $this->option('format'));\n",
              "        $formatOption = $this->option('format');\n        $format = is_string($formatOption) ? strtolower($formatOption) : 'console';\n",
          )
          replace(
              'src/Analysis/AnalysisConfig.php',
              "            if (@preg_match($pattern, '') === false) {\n                throw new \\InvalidArgumentException(\"Invalid custom side-effect regular expression [{$pattern}].\");\n            }\n",
              "            set_error_handler(static fn (): bool => true);\n            try {\n                $valid = preg_match($pattern, '') !== false;\n            } finally {\n                restore_error_handler();\n            }\n\n            if (! $valid) {\n                throw new \\InvalidArgumentException(\"Invalid custom side-effect regular expression [{$pattern}].\");\n            }\n",
          )
          PY

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Apply Pint
        run: composer format

      - name: Verify syntax and regression matrix
        shell: bash
        run: |
          find src config tests tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          composer test:smoke

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src tests tools
          git commit -m 'fix: satisfy release quality gates'
          git push origin HEAD:feature/full-package
