name: Temporary recursion guard patch

on:
  push:
    branches:
      - fix/lazy-metadata-recursion-cycle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/lazy-metadata-recursion-cycle

      - name: Patch recursion guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/Analysis/ClassMetadataIndex.php')
          source = path.read_text()
          old = "if (isset($this->resolvedMetadata[$key], $seen[$key]) || ! isset($this->classes[$key])) {"
          new = "if (isset($this->resolvedMetadata[$key]) || isset($seen[$key]) || ! isset($this->classes[$key])) {"
          if source.count(old) != 1:
              raise SystemExit('expected recursion guard exactly once')
          path.write_text(source.replace(old, new))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Analysis/ClassMetadataIndex.php
          git commit -m 'fix: stop lazy metadata recursion cycles'
          git push origin HEAD:fix/lazy-metadata-recursion-cycle
