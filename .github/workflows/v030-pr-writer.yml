name: v0.3.0 PR writer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  write-validated-patch:
    if: >-
      github.event.pull_request.user.login == 'jordyloeuille' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/v0.3.0-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.3.0-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Apply final v0.3.0 patch
        run: python3 tools/v030_finalize.py

      - name: Lint source
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Format
        run: composer format

      - name: Validate complete gate
        run: composer check:all

      - name: Validate coverage
        run: composer test:coverage

      - name: Commit validated final changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github CHANGELOG.md README.md composer.json config docs src tests tools
          if git diff --cached --quiet; then
            echo 'No final source changes to commit.'
          else
            git commit -m 'release: finalize v0.3.0 hardening'
            git push origin HEAD:release/v0.3.0-hardening
          fi

      - name: Remove superseded audit branches
        shell: bash
        run: |
          for branch in \
            audit/10-notification-via-connections \
            audit/v020-finalize \
            fix/global-dispatch-detection \
            fix/global-dispatch-detection-v2 \
            improve/03-connection-attribute \
            improve/05-branch-aware-manual-transactions \
            release/v0.2.0-hardening
          do
            git push origin --delete "$branch" 2>/dev/null || true
          done
