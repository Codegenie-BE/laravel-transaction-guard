name: v0.3.0 PR writer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  write-validated-patch:
    if: >-
      github.event.pull_request.user.login == 'jordyloeuille' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/v0.3.0-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.3.0-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Apply deterministic hardening patch
        run: python3 tools/v030_patch_runner.py

      - name: Lint generated core source
        shell: bash
        run: |
          if ! php -l src/Analysis/Finding.php; then
            nl -ba src/Analysis/Finding.php
            exit 1
          fi
          find src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Format
        run: composer format

      - name: Validate complete gate
        run: composer check:all

      - name: Validate coverage
        run: composer test:coverage

      - name: Commit validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md composer.json config docs src tests tools
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'release: v0.3.0 analyzer reliability hardening'
          git push origin HEAD:release/v0.3.0-hardening
