name: v0.3.0 hardening maintenance

on:
  push:
    branches:
      - release/v0.3.0-hardening

permissions:
  contents: write

concurrency:
  group: v030-hardening
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor == 'jordyloeuille'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.3.0-hardening
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Apply deterministic hardening patch
        run: python3 tools/v030_patch.py

      - name: Install current dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Format patch
        run: composer format

      - name: Run complete quality gate
        run: composer check:all

      - name: Enforce coverage baseline
        run: composer test:coverage

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md composer.json config docs src tests tools
          if git diff --cached --quiet; then
            echo 'No validated source changes to commit.'
            exit 0
          fi
          git commit -m 'release: v0.3.0 analyzer reliability hardening'
          git push origin HEAD:release/v0.3.0-hardening
