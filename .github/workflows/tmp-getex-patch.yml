name: Temporary GETEX scanner patch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/redis-getex-semantics

      - name: Patch GETEX scanner semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/Analysis/SourceScanner.php')
          source = path.read_text()
          status = []

          local_anchor = "            if ($handle['kind'] === 'redis' && in_array($method, array_map('strtolower', OperationCatalog::REDIS_MUTATIONS), true)) {"
          status.append(f'local_anchor={source.count(local_anchor)}')
          if source.count(local_anchor) == 1 and "$method === 'getex'" not in source:
              local_getex = r'''            if ($handle['kind'] === 'redis' && $method === 'getex') {
                [$mutates, $unknown] = RedisOperationClassifier::getexMutationState($this->statementAt($offset));
                if ($mutates || $unknown) {
                    $this->appendFinding($findings, $offset, 'TG020', Severity::Warning,
                        $mutates
                            ? 'Redis GETEX changes expiration state through a locally assigned Redis connection while a database transaction is open.'
                            : 'Redis GETEX through a locally assigned Redis connection cannot be proven read-only while a database transaction is open.',
                        'Keep GETEX expiry changes after commit; make the modifier statically visible when the call is intentionally read-only.',
                        $mutates ? 'high' : 'medium');
                    $this->appendRetryFinding($findings, $offset, $tx, 'Redis GETEX');
                }

                continue;
            }

'''
              source = source.replace(local_anchor, local_getex + local_anchor, 1)

          command_anchor = "            $commandPattern = "
          status.append(f'command_anchor={source.count(command_anchor)}')
          if source.count(command_anchor) == 1 and '$getexPattern =' not in source:
              facade_getex = r'''            $getexPattern = '/(?<![A-Za-z0-9_])'.preg_quote($alias, '/').'\\s*::(?:(?!;).)*?\\bgetex\\s*\\(/is';
            foreach ($this->matches($getexPattern) as $match) {
                $offset = $match['offset'];
                $tx = $this->eligibleTransaction($offset);
                if ($tx === null) {
                    continue;
                }

                [$mutates, $unknown] = RedisOperationClassifier::getexMutationState($this->statementAt($offset));
                if (! $mutates && ! $unknown) {
                    continue;
                }

                $this->appendFinding($findings, $offset, 'TG020', Severity::Warning,
                    $mutates
                        ? 'Redis GETEX changes expiration state while a database transaction is open.'
                        : 'Redis GETEX cannot be proven read-only while a database transaction is open.',
                    'Keep GETEX expiry changes after commit; make the modifier statically visible when the call is intentionally read-only.',
                    $mutates ? 'high' : 'medium');
                $this->appendRetryFinding($findings, $offset, $tx, 'Redis GETEX');
            }

'''
              source = source.replace(command_anchor, facade_getex + command_anchor, 1)

          kind_anchor = "                $kind = OperationCatalog::redisCommandKind($command);"
          status.append(f'kind_anchor={source.count(kind_anchor)}')
          if source.count(kind_anchor) == 1 and "if ($command === 'GETEX')" not in source:
              kind_logic = r'''                if ($command === 'GETEX') {
                    [$mutates, $unknown] = RedisOperationClassifier::getexMutationState($this->statementAt($offset));
                    if (! $mutates && ! $unknown) {
                        continue;
                    }
                    $kind = $mutates ? 'mutation' : 'unknown';
                } else {
                    $kind = OperationCatalog::redisCommandKind($command);
                }'''
              source = source.replace(kind_anchor, kind_logic, 1)

          callback_anchor = "        $hasInlineCallable = preg_match("
          status.append(f'callback_anchor={source.count(callback_anchor)}')
          if source.count(callback_anchor) == 1 and "RedisOperationClassifier::getexMutationState($statement)" not in source:
              callback_getex = r'''        if (preg_match('/->\\s*getex\\s*\\(/i', $code) === 1) {
            [$mutates, $unknown] = RedisOperationClassifier::getexMutationState($statement);
            if ($mutates || $unknown) {
                return [$mutates, $unknown];
            }
        }

'''
              source = source.replace(callback_anchor, callback_getex + callback_anchor, 1)

          path.write_text(source)
          Path('.github/getex-patch-status.txt').write_text('\n'.join(status) + '\n')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Analysis/SourceScanner.php .github/getex-patch-status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: classify Redis GETEX by expiry arguments'
          git push origin HEAD:fix/redis-getex-semantics
