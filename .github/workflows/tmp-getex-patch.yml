name: Temporary GETEX scanner patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'fix/redis-getex-semantics' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/redis-getex-semantics

      - name: Apply SourceScanner patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/Analysis/SourceScanner.php')
          source = path.read_text()

          local_anchor = "            if ($handle['kind'] === 'redis' && in_array($method, array_map('strtolower', OperationCatalog::REDIS_MUTATIONS), true)) {"
          assert source.count(local_anchor) == 1
          local_block = r'''            if ($handle['kind'] === 'redis' && $method === 'getex') {
                [$mutates, $unknown] = RedisOperationClassifier::getexMutationState($this->statementAt($offset));
                if ($mutates || $unknown) {
                    $this->appendFinding($findings, $offset, 'TG020', Severity::Warning,
                        $mutates
                            ? 'Redis GETEX changes expiration state through a locally assigned Redis connection while a database transaction is open.'
                            : 'Redis GETEX through a locally assigned Redis connection cannot be proven read-only while a database transaction is open.',
                        'Keep GETEX expiry changes after commit; make the modifier statically visible when the call is intentionally read-only.',
                        $mutates ? 'high' : 'medium');
                    $this->appendRetryFinding($findings, $offset, $tx, 'Redis GETEX');
                }

                continue;
            }

'''
          source = source.replace(local_anchor, local_block + local_anchor, 1)

          command_anchor = "            $commandPattern = "
          assert source.count(command_anchor) == 1
          facade_block = r'''            $getexPattern = '/(?<![A-Za-z0-9_])'.preg_quote($alias, '/').'\\s*::(?:(?!;).)*?\\bgetex\\s*\\(/is';
            foreach ($this->matches($getexPattern) as $match) {
                $offset = $match['offset'];
                $tx = $this->eligibleTransaction($offset);
                if ($tx === null) {
                    continue;
                }

                [$mutates, $unknown] = RedisOperationClassifier::getexMutationState($this->statementAt($offset));
                if (! $mutates && ! $unknown) {
                    continue;
                }

                $this->appendFinding($findings, $offset, 'TG020', Severity::Warning,
                    $mutates
                        ? 'Redis GETEX changes expiration state while a database transaction is open.'
                        : 'Redis GETEX cannot be proven read-only while a database transaction is open.',
                    'Keep GETEX expiry changes after commit; make the modifier statically visible when the call is intentionally read-only.',
                    $mutates ? 'high' : 'medium');
                $this->appendRetryFinding($findings, $offset, $tx, 'Redis GETEX');
            }

'''
          source = source.replace(command_anchor, facade_block + command_anchor, 1)

          kind_anchor = "                $kind = OperationCatalog::redisCommandKind($command);"
          assert source.count(kind_anchor) == 1
          kind_block = r'''                if ($command === 'GETEX') {
                    [$mutates, $unknown] = RedisOperationClassifier::getexMutationState($this->statementAt($offset));
                    if (! $mutates && ! $unknown) {
                        continue;
                    }
                    $kind = $mutates ? 'mutation' : 'unknown';
                } else {
                    $kind = OperationCatalog::redisCommandKind($command);
                }'''
          source = source.replace(kind_anchor, kind_block, 1)

          callback_anchor = "        $hasInlineCallable = preg_match("
          assert source.count(callback_anchor) == 1
          callback_block = r'''        if (preg_match('/->\\s*getex\\s*\\(/i', $code) === 1) {
            [$mutates, $unknown] = RedisOperationClassifier::getexMutationState($statement);
            if ($mutates || $unknown) {
                return [$mutates, $unknown];
            }
        }

'''
          source = source.replace(callback_anchor, callback_block + callback_anchor, 1)
          path.write_text(source)
          PY

      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Analysis/SourceScanner.php
          git commit -m 'fix: classify Redis GETEX by expiry arguments'
          git push origin HEAD:fix/redis-getex-semantics
