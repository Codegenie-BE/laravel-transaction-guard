name: V0.2 branch maintenance

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: write
  statuses: write

concurrency:
  group: v02-branch-maintenance
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.actor == 'jordyloeuille' &&
      github.event.pull_request.head.ref == 'feature/v0.2-analyzer-hardening-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head-sha: ${{ steps.commit.outputs.head-sha }}

    steps:
      - name: Checkout authorized PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/v0.2-analyzer-hardening-clean
          fetch-depth: 0

      - name: Apply final efficiency and coverage fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected fragment not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          # 1. Scanner fast-path: after syntax/transaction discovery there is no reason
          # to execute every side-effect matcher in files that contain no transaction.
          replace_once(
              'src/Analysis/SourceScanner.php',
              "        $this->transactions = array_merge($this->findClosureTransactions(), $this->findManualTransactions());\n        $this->afterCommitCallbacks = $this->findAfterCommitCallbacks();\n\n        $findings = [];\n",
              "        $this->transactions = array_merge($this->findClosureTransactions(), $this->findManualTransactions());\n        if ($this->transactions === []) {\n            return [];\n        }\n\n        $this->afterCommitCallbacks = $this->findAfterCommitCallbacks();\n\n        $findings = [];\n",
          )

          # 2. A global dispatch(new ...) helper is itself sufficient evidence that the
          # object is being sent through Laravel's bus; do not require a Jobs namespace.
          replace_once(
              'src/Analysis/SourceScanner.php',
              "                $looksLikeJob = $metadata?->queued() === true\n                    || str_contains(strtolower($resolved), '\\\\jobs\\\\')\n                    || preg_match('/\\\\\\\\Jobs\\\\\\\\/', $resolved) === 1;\n",
              "                $isGlobalDispatchHelper = preg_match('/(?<![A-Za-z0-9_>])(?<!->)\\\\\\\\?dispatch\\s*\\(\\s*new\\s+/i', $statement) === 1;\n                $looksLikeJob = $isGlobalDispatchHelper\n                    || $metadata?->queued() === true\n                    || str_contains(strtolower($resolved), '\\\\jobs\\\\')\n                    || preg_match('/\\\\\\\\Jobs\\\\\\\\/', $resolved) === 1;\n",
          )

          # 3. Build the disabled-rule lookup once; finding hot paths become O(1).
          replace_once(
              'src/Analysis/AnalysisConfig.php',
              "final readonly class AnalysisConfig\n{\n",
              "final readonly class AnalysisConfig\n{\n    /** @var array<string, true> */\n    private array $disabledRuleLookup;\n\n",
          )
          replace_once(
              'src/Analysis/AnalysisConfig.php',
              "    ) {\n        foreach ($this->customSideEffectPatterns as $pattern) {\n",
              "    ) {\n        $this->disabledRuleLookup = array_fill_keys($this->disabledRules, true);\n\n        foreach ($this->customSideEffectPatterns as $pattern) {\n",
          )
          replace_once(
              'src/Analysis/AnalysisConfig.php',
              "        return ! in_array($rule, $this->disabledRules, true);\n",
              "        return ! isset($this->disabledRuleLookup[$rule]);\n",
          )

          # 4. --generate-baseline already runs with baseline filtering disabled. Reuse
          # that result instead of scanning/indexing the entire project a second time.
          replace_once(
              'src/Console/TransactionGuardCommand.php',
              "        if ((bool) $this->option('generate-baseline')) {\n            try {\n                $raw = $guard->analyze($paths, $exclude, null);\n                Baseline::write($baselinePath, $raw->findings);\n            } catch (\\JsonException|\\RuntimeException $exception) {\n                $this->error('Unable to generate Transaction Guard baseline: '.$exception->getMessage());\n\n                return self::INVALID;\n            }\n\n            $this->info(sprintf('Transaction Guard baseline written: %s (%d findings).', $baselinePath, count($raw->findings)));\n\n            return self::SUCCESS;\n        }\n",
              "        if ((bool) $this->option('generate-baseline')) {\n            try {\n                Baseline::write($baselinePath, $result->findings);\n            } catch (\\JsonException|\\RuntimeException $exception) {\n                $this->error('Unable to generate Transaction Guard baseline: '.$exception->getMessage());\n\n                return self::INVALID;\n            }\n\n            $this->info(sprintf('Transaction Guard baseline written: %s (%d findings).', $baselinePath, count($result->findings)));\n\n            return self::SUCCESS;\n        }\n",
          )

          # 5. Lock the global dispatch false-negative with a non-conventional namespace.
          matrix = Path('tests/Support/ScenarioMatrix.php')
          text = matrix.read_text()
          marker = "    'fully qualified DB and Http facades are detected' => [\n"
          if marker not in text:
              raise SystemExit('Scenario insertion marker not found')
          scenario = r'''    'global dispatch helper detects job outside Jobs namespace' => [
        'code' => <<<'PHP'
<?php
namespace App\Work;
use Illuminate\Support\Facades\DB;
class RecalculateOrder {}
DB::transaction(function () { dispatch(new RecalculateOrder()); });
PHP,
        'rules' => ['TG001'],
    ],
'''
          text = text.replace(marker, scenario + marker, 1)
          matrix.write_text(text)

          # 6. Document the strongest hot-path optimization explicitly.
          analysis = Path('docs/ANALYSIS.md')
          text = analysis.read_text()
          needle = 'The analyzer hot path now pre-indexes source lines and non-code token ranges, caches statement/facade lookups, uses binary-search token/line lookup, and avoids temporary filter/sort allocations when selecting transaction/callable regions.'
          replacement = needle + ' Files with no detected database transaction return immediately after transaction discovery, before any side-effect rule scans run.'
          if needle in text and replacement not in text:
              text = text.replace(needle, replacement, 1)
          analysis.write_text(text)
          PY

      - name: Setup PHP for formatting
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Apply Pint
        run: composer format

      - name: Commit validated branch changes
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/Analysis/SourceScanner.php src/Analysis/AnalysisConfig.php src/Console/TransactionGuardCommand.php tests/Support/ScenarioMatrix.php docs/ANALYSIS.md
          if ! git diff --cached --quiet; then
            git commit -m 'perf: finish analyzer hot-path hardening'
            git push origin HEAD:feature/v0.2-analyzer-hardening-clean
          fi
          echo "head-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  compatibility:
    needs: fix
    if: needs.fix.result == 'success'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'

    steps:
      - name: Checkout fixed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fix.outputs.head-sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin Laravel test dependencies
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Run smoke regression matrix
        run: composer test:smoke

      - name: Run Pest suite
        run: composer test

      - name: Check formatting
        run: composer format:test

      - name: Run PHPStan
        run: composer analyse

  coverage:
    needs: fix
    if: needs.fix.result == 'success'
    name: Coverage / PHP 8.5 / Laravel 13
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout fixed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fix.outputs.head-sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Pin Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:^11.0' 'pestphp/pest:^4.0' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Enforce coverage baseline
        run: composer test:coverage

  validation-status:
    needs:
      - fix
      - compatibility
      - coverage
    if: always() && needs.fix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Publish v0.2 validation status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.fix.outputs.head-sha }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        shell: bash
        run: |
          state=success
          description='Full Laravel 12/13 compatibility and coverage matrix passed'
          if [ "${COMPATIBILITY_RESULT}" != 'success' ] || [ "${COVERAGE_RESULT}" != 'success' ]; then
            state=failure
            description='V0.2 compatibility or coverage validation failed'
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context='v0.2-maintenance' \
            -f description="${description}"

          [ "${state}" = 'success' ]
