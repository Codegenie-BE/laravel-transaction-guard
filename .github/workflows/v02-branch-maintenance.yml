name: V0.2 branch maintenance

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [reopened]

permissions:
  contents: write
  statuses: write

concurrency:
  group: v02-branch-maintenance
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.actor == 'jordyloeuille' &&
      (
        (github.event_name == 'issues' && github.event.issue.title == 'Run final Transaction Guard v0.2 validation') ||
        (github.event_name == 'pull_request_target' && github.event.pull_request.head.ref == 'feature/v0.2-analyzer-hardening-clean')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head-sha: ${{ steps.commit.outputs.head-sha }}

    steps:
      - name: Checkout authorized PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/v0.2-analyzer-hardening-clean
          fetch-depth: 0

      - name: Apply final analyzer fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/Analysis/SourceScanner.php')
          text = source.read_text()

          # Fast return for syntactically valid files with no database transaction.
          fast_old = "        $this->transactions = array_merge($this->findClosureTransactions(), $this->findManualTransactions());\n        $this->afterCommitCallbacks = $this->findAfterCommitCallbacks();\n\n        $findings = [];\n"
          fast_new = "        $this->transactions = array_merge($this->findClosureTransactions(), $this->findManualTransactions());\n        if ($this->transactions === []) {\n            return [];\n        }\n\n        $this->afterCommitCallbacks = $this->findAfterCommitCallbacks();\n\n        $findings = [];\n"
          if fast_old in text:
              text = text.replace(fast_old, fast_new, 1)

          # The global dispatch helper is itself evidence of Laravel bus dispatch.
          job_old = "                $looksLikeJob = $metadata?->queued() === true\n"
          job_new = "                $isGlobalDispatchHelper = preg_match('/(?<![A-Za-z0-9_>])(?<!->)\\\\?dispatch\\s*\\(\\s*new\\s+/i', $statement) === 1;\n                $looksLikeJob = $isGlobalDispatchHelper\n                    || $metadata?->queued() === true\n"
          if job_old in text:
              text = text.replace(job_old, job_new, 1)

          # PHPStan can prove metadata is non-null whenever $queued is true here.
          start = text.index('    private function scanNotifications')
          end = text.index('    private function scanBroadcasts', start)
          section = text[start:end]
          section = section.replace('$metadata?->queueAfterCommit()', '$metadata->queueAfterCommit()', 1)
          text = text[:start] + section + text[end:]

          # Avoid by-reference closure state that PHPStan correctly cannot model.
          flush_old = '''            $flush = function () use (&$regions, &$groupStart, &$groupEnd, &$depth): void {
                if ($groupStart === null) {
                    return;
                }

                $end = $groupEnd ?? strlen($this->source);
                $regions[] = [
                    'start' => $groupStart['end'],
                    'end' => $end,
                    'line' => $this->lineAtOffset($groupStart['offset']),
                    'type' => 'manual',
                    'attempts' => 1,
                    'connection' => $groupStart['connection'],
                    'callableStart' => $groupStart['end'],
                    'callableEnd' => $end,
                ];

                $groupStart = null;
                $groupEnd = null;
                $depth = 0;
            };
'''
          flush_new = '''            /** @param DatabaseControlCall|null $start */
            $flush = function (?array $start, ?int $endOffset) use (&$regions): void {
                if ($start === null) {
                    return;
                }

                $end = $endOffset ?? strlen($this->source);
                $regions[] = [
                    'start' => $start['end'],
                    'end' => $end,
                    'line' => $this->lineAtOffset($start['offset']),
                    'type' => 'manual',
                    'attempts' => 1,
                    'connection' => $start['connection'],
                    'callableStart' => $start['end'],
                    'callableEnd' => $end,
                ];
            };
'''
          if flush_old in text:
              text = text.replace(flush_old, flush_new, 1)
              text = text.replace("                        $flush();\n                    }\n                    if ($groupStart === null) {", "                        $flush($groupStart, $groupEnd);\n                        $groupStart = null;\n                        $groupEnd = null;\n                        $depth = 0;\n                    }\n                    if ($groupStart === null) {", 1)
              text = text.replace("            $flush();\n        }\n\n        return $regions;", "            $flush($groupStart, $groupEnd);\n        }\n\n        return $regions;", 1)
          source.write_text(text)

          metadata = Path('src/Analysis/ClassMetadataIndex.php')
          text = metadata.read_text()
          signature = '    private function queueNameFor(string $class, array $seen = []): ?string\n'
          if '/** @param  array<string, true>  $seen */\n' + signature not in text:
              if signature not in text:
                  raise SystemExit('queueNameFor signature not found')
              text = text.replace(signature, '    /** @param  array<string, true>  $seen */\n' + signature, 1)
          metadata.write_text(text)

          matrix = Path('tests/Support/ScenarioMatrix.php')
          text = matrix.read_text()
          if 'global dispatch helper detects job outside Jobs namespace' not in text:
              marker = "    'fully qualified DB and Http facades are detected' => [\n"
              if marker not in text:
                  raise SystemExit('Scenario insertion marker not found')
              scenario = r'''    'global dispatch helper detects job outside Jobs namespace' => [
        'code' => <<<'PHP'
<?php
namespace App\Work;
use Illuminate\Support\Facades\DB;
class RecalculateOrder {}
DB::transaction(function () { dispatch(new RecalculateOrder()); });
PHP,
        'rules' => ['TG001'],
    ],
'''
              text = text.replace(marker, scenario + marker, 1)
              matrix.write_text(text)

          analysis = Path('docs/ANALYSIS.md')
          text = analysis.read_text()
          sentence = 'Files with no detected database transaction return immediately after transaction discovery, before any side-effect rule scans run.'
          needle = 'The analyzer hot path now pre-indexes source lines and non-code token ranges, caches statement/facade lookups, uses binary-search token/line lookup, and avoids temporary filter/sort allocations when selecting transaction/callable regions.'
          if sentence not in text and needle in text:
              analysis.write_text(text.replace(needle, needle + ' ' + sentence, 1))
          PY

      - name: Setup PHP for formatting
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Apply Pint
        run: composer format

      - name: Commit branch changes
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/Analysis/SourceScanner.php src/Analysis/ClassMetadataIndex.php tests/Support/ScenarioMatrix.php docs/ANALYSIS.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix: complete v0.2 analyzer validation'
            git push origin HEAD:feature/v0.2-analyzer-hardening-clean
          fi
          echo "head-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  compatibility:
    needs: fix
    if: needs.fix.result == 'success'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'

    steps:
      - name: Checkout fixed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fix.outputs.head-sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction
      - run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer audit --no-interaction
      - run: composer test:smoke
      - run: composer test
      - run: composer format:test
      - run: composer analyse

  coverage:
    needs: fix
    if: needs.fix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fix.outputs.head-sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2
      - run: composer require --dev 'orchestra/testbench:^11.0' 'pestphp/pest:^4.0' --no-update --no-interaction
      - run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - run: composer test:coverage

  validation-status:
    needs: [fix, compatibility, coverage]
    if: always() && needs.fix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish validation status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.fix.outputs.head-sha }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          state=success
          description='Full Laravel 12/13 compatibility and coverage matrix passed'
          if [ "${COMPATIBILITY_RESULT}" != 'success' ] || [ "${COVERAGE_RESULT}" != 'success' ]; then
            state=failure
            description='V0.2 compatibility or coverage validation failed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state="${state}" -f context='v0.2-maintenance' -f description="${description}"
          [ "${state}" = 'success' ]
