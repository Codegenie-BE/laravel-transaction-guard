name: Cleanup merged branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Delete merged non-main branches
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
            | while read -r branch; do
                if [ -z "${branch}" ] || [ "${branch}" = "main" ] || [ "${branch}" = "HEAD" ]; then
                  continue
                fi

                branch_sha="$(git rev-parse "refs/remotes/origin/${branch}")"
                merged=false

                if git merge-base --is-ancestor "${branch_sha}" origin/main; then
                  merged=true
                else
                  merged_prs="$(gh pr list \
                    --state merged \
                    --base main \
                    --head "${branch}" \
                    --json number,headRepositoryOwner \
                    --jq "[.[] | select(.headRepositoryOwner.login == \"${REPOSITORY_OWNER}\")] | length")"

                  if [ "${merged_prs}" -gt 0 ]; then
                    merged=true
                  fi
                fi

                if [ "${merged}" = "true" ]; then
                  echo "Deleting merged branch ${branch} at ${branch_sha}."

                  if ! git push \
                    --force-with-lease="refs/heads/${branch}:${branch_sha}" \
                    origin ":refs/heads/${branch}"; then
                    echo "Keeping ${branch}: its remote tip changed after validation."
                  fi
                else
                  echo "Keeping unmerged branch ${branch}."
                fi
              done
