name: Bootstrap package

on:
  push:
    branches:
      - feature/full-package
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    name: Import validated package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Reconstruct package
        shell: bash
        run: |
          cat .bootstrap/part-* > /tmp/laravel-transaction-guard.tar.xz.b64
          base64 --decode /tmp/laravel-transaction-guard.tar.xz.b64 > /tmp/laravel-transaction-guard.tar.xz
          tar -xJf /tmp/laravel-transaction-guard.tar.xz -C .

      - name: Validate imported source
        shell: bash
        run: |
          php tools/smoke.php
          find src config tests tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          composer validate --strict --no-check-lock

      - name: Commit package
        shell: bash
        run: |
          rm -rf .bootstrap .github/workflows/bootstrap-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Laravel Transaction Guard"
          git push origin HEAD:${{ github.head_ref || 'feature/full-package' }}
