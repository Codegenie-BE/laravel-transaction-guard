name: Temporary post-v0.4 hardening trigger

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'hardening/post-v040-audit' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/post-v040-audit

      - name: Extract and run audited patch script
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/^[[:space:]]*python - <<'PY'$/,/^[[:space:]]*PY$/p" .github/workflows/tmp-post-v040-hardening.yml \
            | sed '1d;$d;s/^          //' > /tmp/post-v040-patch.py
          python /tmp/post-v040-patch.py

      - name: Commit patched analyzer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Analysis/SourceScanner.php src/Analysis/ClassMetadataIndex.php
          if git diff --cached --quiet; then
            echo 'Analyzer patch already applied.'
            exit 0
          fi
          git commit -m 'fix: harden analyzer context and Redis coverage'
          git push origin HEAD:hardening/post-v040-audit
