name: V0.2 self fix

on:
  push:
    branches:
      - feature/v0.2-analyzer-hardening-clean

permissions:
  contents: write

concurrency:
  group: v02-self-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/v0.2-analyzer-hardening-clean
          fetch-depth: 0

      - name: Apply final reviewed fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/Analysis/SourceScanner.php')
          text = source.read_text()

          fast_old = "        $this->transactions = array_merge($this->findClosureTransactions(), $this->findManualTransactions());\n        $this->afterCommitCallbacks = $this->findAfterCommitCallbacks();\n\n        $findings = [];\n"
          fast_new = "        $this->transactions = array_merge($this->findClosureTransactions(), $this->findManualTransactions());\n        if ($this->transactions === []) {\n            return [];\n        }\n\n        $this->afterCommitCallbacks = $this->findAfterCommitCallbacks();\n\n        $findings = [];\n"
          if fast_old in text:
              text = text.replace(fast_old, fast_new, 1)

          job_old = "                $looksLikeJob = $metadata?->queued() === true\n"
          job_new = "                $isGlobalDispatchHelper = preg_match('/(?<![A-Za-z0-9_>])(?<!->)\\\\?dispatch\\s*\\(\\s*new\\s+/i', $statement) === 1;\n                $looksLikeJob = $isGlobalDispatchHelper\n                    || $metadata?->queued() === true\n"
          if job_old in text:
              text = text.replace(job_old, job_new, 1)

          start = text.index('    private function scanNotifications')
          end = text.index('    private function scanBroadcasts', start)
          section = text[start:end].replace('$metadata?->queueAfterCommit()', '$metadata->queueAfterCommit()', 1)
          text = text[:start] + section + text[end:]

          flush_old = '''            $flush = function () use (&$regions, &$groupStart, &$groupEnd, &$depth): void {
                if ($groupStart === null) {
                    return;
                }

                $end = $groupEnd ?? strlen($this->source);
                $regions[] = [
                    'start' => $groupStart['end'],
                    'end' => $end,
                    'line' => $this->lineAtOffset($groupStart['offset']),
                    'type' => 'manual',
                    'attempts' => 1,
                    'connection' => $groupStart['connection'],
                    'callableStart' => $groupStart['end'],
                    'callableEnd' => $end,
                ];

                $groupStart = null;
                $groupEnd = null;
                $depth = 0;
            };
'''
          flush_new = '''            /** @param DatabaseControlCall|null $start */
            $flush = function (?array $start, ?int $endOffset) use (&$regions): void {
                if ($start === null) {
                    return;
                }

                $end = $endOffset ?? strlen($this->source);
                $regions[] = [
                    'start' => $start['end'],
                    'end' => $end,
                    'line' => $this->lineAtOffset($start['offset']),
                    'type' => 'manual',
                    'attempts' => 1,
                    'connection' => $start['connection'],
                    'callableStart' => $start['end'],
                    'callableEnd' => $end,
                ];
            };
'''
          if flush_old in text:
              text = text.replace(flush_old, flush_new, 1)
              text = text.replace("                        $flush();\n                    }\n                    if ($groupStart === null) {", "                        $flush($groupStart, $groupEnd);\n                        $groupStart = null;\n                        $groupEnd = null;\n                        $depth = 0;\n                    }\n                    if ($groupStart === null) {", 1)
              text = text.replace("            $flush();\n        }\n\n        return $regions;", "            $flush($groupStart, $groupEnd);\n        }\n\n        return $regions;", 1)
          source.write_text(text)

          metadata = Path('src/Analysis/ClassMetadataIndex.php')
          text = metadata.read_text()
          signature = '    private function queueNameFor(string $class, array $seen = []): ?string\n'
          doc = '    /** @param  array<string, true>  $seen */\n'
          if doc + signature not in text:
              if signature not in text:
                  raise SystemExit('queueNameFor signature not found')
              text = text.replace(signature, doc + signature, 1)
          metadata.write_text(text)

          matrix = Path('tests/Support/ScenarioMatrix.php')
          text = matrix.read_text()
          if 'global dispatch helper detects job outside Jobs namespace' not in text:
              marker = "    'fully qualified DB and Http facades are detected' => [\n"
              if marker not in text:
                  raise SystemExit('Scenario insertion marker not found')
              scenario = r'''    'global dispatch helper detects job outside Jobs namespace' => [
        'code' => <<<'PHP'
<?php
namespace App\Work;
use Illuminate\Support\Facades\DB;
class RecalculateOrder {}
DB::transaction(function () { dispatch(new RecalculateOrder()); });
PHP,
        'rules' => ['TG001'],
    ],
'''
              matrix.write_text(text.replace(marker, scenario + marker, 1))
          PY

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - run: composer format
      - run: composer test:smoke
      - run: composer test
      - run: composer analyse

      - name: Commit validated fixes and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v02-self-fix.yml
          git add -- src/Analysis/SourceScanner.php src/Analysis/ClassMetadataIndex.php tests/Support/ScenarioMatrix.php
          git commit -m 'fix: complete v0.2 analyzer validation'
          git push origin HEAD:feature/v0.2-analyzer-hardening-clean
