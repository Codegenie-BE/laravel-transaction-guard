name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
            smoke: true
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
            full_quality: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate repository Composer metadata
        if: ${{ matrix.full_quality == true }}
        run: composer validate --strict

      - name: Pin Laravel test dependencies
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Audit latest Laravel 12 dependency set
        if: ${{ matrix.full_quality == true }}
        run: composer audit --no-interaction

      - name: Run dependency-free regression matrix on oldest PHP
        if: ${{ matrix.smoke == true }}
        run: composer test:smoke

      - name: Run Pest suite
        run: composer test

      - name: Validate optimized autoloading
        if: ${{ matrix.full_quality == true }}
        run: composer check:autoload

      - name: Check formatting
        if: ${{ matrix.full_quality == true }}
        run: composer format:test

      - name: Run static analysis against latest Laravel 12
        if: ${{ matrix.full_quality == true }}
        run: composer analyse

      - name: Check documentation contracts
        if: ${{ matrix.full_quality == true }}
        run: composer check:docs

      - name: Run benchmark bootstrap smoke
        if: ${{ matrix.full_quality == true }}
        run: composer test:benchmark-smoke

  platform:
    name: ${{ matrix.label }} / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: Windows
            runner: windows-latest
            php: '8.2'
            laravel: '^12.0'
            testbench: '10.*'
            pest: '3.*'
          - label: Windows
            runner: windows-latest
            php: '8.5'
            laravel: '^13.0'
            testbench: '11.*'
            pest: '4.*'
          - label: macOS
            runner: macos-latest
            php: '8.2'
            laravel: '^12.0'
            testbench: '10.*'
            pest: '3.*'
          - label: macOS
            runner: macos-latest
            php: '8.5'
            laravel: '^13.0'
            testbench: '11.*'
            pest: '4.*'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: fileinfo
          tools: composer:v2

      - name: Pin Laravel test dependencies
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Run full cross-platform Pest suite
        run: composer test

  lowest:
    name: Lowest supported Laravel 12 dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Pin lowest supported Laravel 12 test dependencies
        run: composer require --dev 'orchestra/testbench:^10.0' 'pestphp/pest:^3.0' --no-update --no-interaction

      - name: Resolve lowest supported dependency set
        run: composer update --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --no-progress

      - name: Audit lowest Laravel 12 dependency set
        run: composer audit --no-interaction

      - name: Run Pest suite on lowest Laravel 12 dependencies
        run: composer test

      - name: Run static analysis on lowest Laravel 12 dependencies
        run: composer analyse

  lowest-laravel13:
    name: Lowest supported Laravel 13 dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Pin lowest supported Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:^11.0' 'pestphp/pest:^4.0' --no-update --no-interaction

      - name: Resolve lowest supported Laravel 13 dependency set
        run: composer update --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --no-progress

      - name: Audit lowest Laravel 13 dependency set
        run: composer audit --no-interaction

      - name: Run Pest suite on lowest Laravel 13 dependencies
        run: composer test

      - name: Run static analysis on lowest Laravel 13 dependencies
        run: composer analyse

  coverage:
    name: Coverage / PHP 8.5 / Laravel 13
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Pin Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:^11.0' 'pestphp/pest:^4.0' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Audit latest Laravel 13 dependency set
        run: composer audit --no-interaction

      - name: Run dependency-free regression matrix on newest PHP
        run: composer test:smoke

      - name: Run static analysis against latest Laravel 13
        env:
          XDEBUG_MODE: off
        run: composer analyse

      - name: Enforce coverage baseline
        run: composer test:coverage

  distribution:
    name: Distribution archive
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Validate distribution archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          composer archive --format=zip --dir=build
          archive="$(find build -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "${archive}"

          invalid="$({
            unzip -Z1 "${archive}" | awk '
              {
                entry=$0
                if (entry == "" || entry ~ /\/$/) next
                if (entry == "composer.json" || entry == "README.md" || entry == "LICENSE.md" || entry == "CHANGELOG.md" || entry == "SECURITY.md") next
                if (entry ~ /^src\// || entry ~ /^config\//) next
                print entry
              }
            '
          } || true)"

          if [ -n "${invalid}" ]; then
            echo 'Distribution archive contains files outside the explicit allowlist:' >&2
            printf '%s\n' "${invalid}" >&2
            exit 1
          fi

  required:
    name: Tests / Required
    needs:
      - compatibility
      - platform
      - lowest
      - lowest-laravel13
      - coverage
      - distribution
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every test job to succeed
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          LOWEST_RESULT: ${{ needs.lowest.result }}
          LOWEST_LARAVEL13_RESULT: ${{ needs.lowest-laravel13.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
        shell: bash
        run: |
          test "${COMPATIBILITY_RESULT}" = 'success'
          test "${PLATFORM_RESULT}" = 'success'
          test "${LOWEST_RESULT}" = 'success'
          test "${LOWEST_LARAVEL13_RESULT}" = 'success'
          test "${COVERAGE_RESULT}" = 'success'
          test "${DISTRIBUTION_RESULT}" = 'success'
