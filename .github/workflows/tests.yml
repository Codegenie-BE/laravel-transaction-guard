name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_MAX_PARALLEL_HTTP: 4

jobs:
  apply-global-dispatch-fix:
    name: Apply global dispatch detection fix
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/global-dispatch-detection' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/global-dispatch-detection
          fetch-depth: 0
      - name: Apply reviewed source and regression changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/Analysis/SourceScanner.php')
          text = source.read_text()
          old = """                $metadata = $this->classIndex->metadata($resolved);\n                $method = $this->captured($match, 'method');\n                $statement = $this->statementAt($offset);\n                $looksLikeJob = $metadata?->queued() === true\n                    || str_contains(strtolower($resolved), '\\\\jobs\\\\')\n                    || preg_match('/\\\\\\\\Jobs\\\\\\\\/', $resolved) === 1;\n"""
          new = """                $metadata = $this->classIndex->metadata($resolved);\n                $method = $this->captured($match, 'method');\n                $statement = $this->statementAt($offset);\n                $globalDispatchHelper = preg_match('/(?<![A-Za-z0-9_>])(?<!->)\\\\\\\\?dispatch\\\\s*\\\\(\\\\s*new\\\\s+/i', $statement) === 1;\n                $looksLikeJob = $globalDispatchHelper\n                    || $metadata?->queued() === true\n                    || str_contains(strtolower($resolved), '\\\\jobs\\\\')\n                    || preg_match('/\\\\\\\\Jobs\\\\\\\\/', $resolved) === 1;\n"""
          if old not in text:
              raise SystemExit('SourceScanner dispatch block not found')
          source.write_text(text.replace(old, new, 1))

          matrix = Path('tests/Support/ScenarioMatrix.php')
          text = matrix.read_text()
          marker = "    'fully qualified DB and Http facades are detected' => [\n"
          scenario = r'''    'global dispatch helper detects job outside Jobs namespace' => [
        'code' => <<<'PHP'
<?php
namespace App\Work;
use Illuminate\Support\Facades\DB;
class RecalculateOrder {}
DB::transaction(function () { dispatch(new RecalculateOrder()); });
PHP,
        'rules' => ['TG001'],
    ],
    'global dispatch helper outside Jobs namespace is safe after commit' => [
        'code' => <<<'PHP'
<?php
namespace App\Work;
use Illuminate\Support\Facades\DB;
class RecalculateOrder {}
DB::transaction(function () { dispatch(new RecalculateOrder())->afterCommit(); });
PHP,
        'rules' => [],
        'absent' => ['TG001'],
    ],
'''
          if marker not in text:
              raise SystemExit('Scenario insertion marker not found')
          if 'global dispatch helper detects job outside Jobs namespace' not in text:
              matrix.write_text(text.replace(marker, scenario + marker, 1))
          PY
      - name: Format and validate focused changes
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - run: composer format
      - run: composer test:smoke
      - run: composer test
      - run: composer analyse
      - name: Commit source changes and restore CI workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          git add src/Analysis/SourceScanner.php tests/Support/ScenarioMatrix.php .github/workflows/tests.yml
          git commit -m 'fix: detect global dispatch outside Jobs namespaces'
          git push origin HEAD:fix/global-dispatch-detection

  quality:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Pin Laravel test dependencies
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction
      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Audit dependencies
        run: composer audit --no-interaction
      - name: Run dependency-free regression matrix
        run: composer test:smoke
      - name: Run Pest suite
        run: composer test
      - name: Check formatting
        run: composer format:test
      - name: Run static analysis
        run: composer analyse

  coverage:
    name: Coverage / PHP 8.5 / Laravel 13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2
      - name: Pin Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:^11.0' 'pestphp/pest:^4.0' --no-update --no-interaction
      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - name: Enforce coverage baseline
        run: composer test:coverage

  release:
    name: Publish validated changelog release
    needs:
      - quality
      - coverage
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success' &&
      needs.coverage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout validated main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          tag="$(sed -nE 's/^## \[(v[0-9]+\.[0-9]+\.[0-9]+)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$/\1/p' CHANGELOG.md | head -n 1)"
          if [ -z "${tag}" ]; then
            echo 'No versioned changelog section found; no release to publish.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; checking release publication state."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo "Publishing ${tag} from ${GITHUB_SHA}."
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create annotated release tag
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "${RELEASE_TAG}" --message "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"
      - name: Ensure GitHub release exists
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists."
            exit 0
          fi
          gh release create "${RELEASE_TAG}" --verify-tag --generate-notes --title "${RELEASE_TAG}"
      - name: Check Packagist visibility
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          endpoint='https://repo.packagist.org/p2/codegenie-be/laravel-transaction-guard.json'
          for attempt in {1..6}; do
            if response="$(curl --fail --silent --show-error --location "${endpoint}" 2>/dev/null)"; then
              if jq --exit-status --arg tag "${RELEASE_TAG}" --arg commit "${RELEASE_COMMIT}" '.packages["codegenie-be/laravel-transaction-guard"] | any(.version == $tag and .source.reference == $commit)' <<< "${response}" >/dev/null; then
                echo "Packagist exposes ${RELEASE_TAG} at ${RELEASE_COMMIT}."
                exit 0
              fi
            fi
            echo "Waiting for Packagist visibility (${attempt}/6)..."
            sleep 10
          done
          echo 'Packagist does not expose this package yet. The GitHub release remains valid; initial Packagist registration must be completed through an authorized Packagist account.'
