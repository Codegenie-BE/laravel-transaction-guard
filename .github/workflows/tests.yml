name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  COMPOSER_MAX_PARALLEL_HTTP: 4

jobs:
  point-01-fix:
    name: Apply reviewed Bus dispatch semantics
    if: github.event_name == 'pull_request' && github.head_ref == 'improve/01-bus-dispatch-semantics' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: improve/01-bus-dispatch-semantics
          fetch-depth: 0
      - name: Apply source and scenario patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/Analysis/SourceScanner.php')
          text = source.read_text()
          old = '''                if ($method === 'dispatch' && $this->callArgumentContainsPreference($statement, 'dispatch', 'beforeCommit')) {
                    $this->appendExplicitBeforeCommitFinding($findings, $offset);
                    $this->appendRetryFinding($findings, $offset, $tx, 'bus dispatch');

                    continue;
                }

                if ($method === 'batch') {
'''
          new = '''                if ($method === 'dispatch') {
                    $jobClass = $this->newClassFromStatement($statement);
                    $jobMetadata = $jobClass !== null
                        ? $this->classIndex->metadata($this->context->resolve($jobClass))
                        : null;

                    if ($jobMetadata !== null && ! $jobMetadata->queued()) {
                        $this->appendFinding($findings, $offset, 'TG016', Severity::Warning,
                            'Bus::dispatch() executes a non-queueable command synchronously while the database transaction is open.',
                            'Move the command outside the transaction when its handler can observe committed state or cause irreversible effects.', 'high');
                        $this->appendRetryFinding($findings, $offset, $tx, 'synchronous bus dispatch');

                        continue;
                    }

                    if ($this->callArgumentContainsPreference($statement, 'dispatch', 'beforeCommit')
                        || $jobMetadata?->explicitlyBeforeCommit() === true) {
                        $this->appendExplicitBeforeCommitFinding($findings, $offset);
                        $this->appendRetryFinding($findings, $offset, $tx, 'bus dispatch');

                        continue;
                    }

                    if ($jobMetadata !== null) {
                        if ($this->callArgumentContainsPreference($statement, 'dispatch', 'afterCommit')
                            || $jobMetadata->queueAfterCommit()
                            || $this->queueConnectionDispatchesAfterCommit($statement, $jobMetadata)) {
                            continue;
                        }

                        $this->appendFinding($findings, $offset, 'TG001', Severity::Error,
                            "Bus::dispatch() may enqueue [{$this->basename($jobMetadata->name)}] before the surrounding database transaction commits.",
                            'Use afterCommit(), ShouldQueueAfterCommit, a safe queue after_commit policy, or dispatch after the transaction.', 'high',
                            ['queue_connection' => $this->queueConnectionFromStatement($statement, $jobMetadata)]);
                        $this->appendRetryFinding($findings, $offset, $tx, 'bus dispatch');

                        continue;
                    }

                    $this->appendFinding($findings, $offset, 'TG001', Severity::Warning,
                        'Bus::dispatch() cannot be proven queued; the unresolved command may execute synchronously or enqueue before commit.',
                        'Make the command class analyzable, or move dispatch after commit so either Laravel execution path is transaction-safe.', 'medium');
                    $this->appendRetryFinding($findings, $offset, $tx, 'bus dispatch');

                    continue;
                }

                if ($method === 'batch') {
'''
          if old not in text:
              raise SystemExit('Bus dispatch source marker not found')
          source.write_text(text.replace(old, new, 1))

          matrix = Path('tests/Support/ScenarioMatrix.php')
          text = matrix.read_text()
          old_case = '''    'Bus dispatch afterCommit is safe' => [
        'code' => <<<'PHP'
<?php
use Illuminate\\Support\\Facades\\Bus;
use Illuminate\\Support\\Facades\\DB;
DB::transaction(function () { Bus::dispatch((new \\App\\Jobs\\ProcessOrder())->afterCommit()); });
PHP,
        'rules' => [],
        'absent' => ['TG001'],
    ],
'''
          new_case = '''    'Bus dispatch afterCommit is safe' => [
        'code' => <<<'PHP'
<?php
namespace App\\Jobs;
use Illuminate\\Contracts\\Queue\\ShouldQueue;
use Illuminate\\Support\\Facades\\Bus;
use Illuminate\\Support\\Facades\\DB;
class ProcessOrder implements ShouldQueue { public function afterCommit(): static { return $this; } }
DB::transaction(function () { Bus::dispatch((new ProcessOrder())->afterCommit()); });
PHP,
        'rules' => [],
        'absent' => ['TG001', 'TG016'],
    ],
    'Bus dispatch ShouldQueueAfterCommit command is safe' => [
        'code' => <<<'PHP'
<?php
namespace App\\Jobs;
use Illuminate\\Contracts\\Queue\\ShouldQueueAfterCommit;
use Illuminate\\Support\\Facades\\Bus;
use Illuminate\\Support\\Facades\\DB;
class ProcessOrder implements ShouldQueueAfterCommit {}
DB::transaction(function () { Bus::dispatch(new ProcessOrder()); });
PHP,
        'rules' => [],
        'absent' => ['TG001', 'TG016'],
    ],
    'Bus dispatch known queued command is flagged before commit' => [
        'code' => <<<'PHP'
<?php
namespace App\\Jobs;
use Illuminate\\Contracts\\Queue\\ShouldQueue;
use Illuminate\\Support\\Facades\\Bus;
use Illuminate\\Support\\Facades\\DB;
class ProcessOrder implements ShouldQueue {}
DB::transaction(function () { Bus::dispatch(new ProcessOrder()); });
PHP,
        'rules' => ['TG001'],
        'absent' => ['TG016'],
    ],
    'Bus dispatch known non queueable command is synchronous' => [
        'code' => <<<'PHP'
<?php
namespace App\\Commands;
use Illuminate\\Support\\Facades\\Bus;
use Illuminate\\Support\\Facades\\DB;
class RecalculateOrder {}
DB::transaction(function () { Bus::dispatch(new RecalculateOrder()); });
PHP,
        'rules' => ['TG016'],
        'absent' => ['TG001'],
    ],
'''
          if old_case not in text:
              raise SystemExit('Bus scenario marker not found')
          matrix.write_text(text.replace(old_case, new_case, 1))
          PY
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - run: composer format
      - run: composer test:smoke
      - run: composer test
      - name: Commit source changes and restore CI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          git rm -f .github/workflows/point-01-fix.yml || true
          git add src/Analysis/SourceScanner.php tests/Support/ScenarioMatrix.php .github/workflows/tests.yml .github/workflows/point-01-fix.yml
          git commit -m 'fix: model Bus dispatch execution semantics'
          git push origin HEAD:improve/01-bus-dispatch-semantics

  quality:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    if: github.head_ref != 'improve/01-bus-dispatch-semantics'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Pin Laravel test dependencies
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction
      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Audit dependencies
        run: composer audit --no-interaction
      - name: Run dependency-free regression matrix
        run: composer test:smoke
      - name: Run Pest suite
        run: composer test
      - name: Check formatting
        run: composer format:test
      - name: Run static analysis
        run: composer analyse

  coverage:
    name: Coverage / PHP 8.5 / Laravel 13
    if: github.head_ref != 'improve/01-bus-dispatch-semantics'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2
      - name: Pin Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:^11.0' 'pestphp/pest:^4.0' --no-update --no-interaction
      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
      - name: Enforce coverage baseline
        run: composer test:coverage

  release:
    name: Publish validated changelog release
    needs:
      - quality
      - coverage
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success' && needs.coverage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout validated main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          tag="$(sed -nE 's/^## \[(v[0-9]+\.[0-9]+\.[0-9]+)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$/\1/p' CHANGELOG.md | head -n 1)"
          if [ -z "${tag}" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create annotated release tag
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "${RELEASE_TAG}" --message "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"
      - name: Ensure GitHub release exists
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || gh release create "${RELEASE_TAG}" --verify-tag --generate-notes --title "${RELEASE_TAG}"
