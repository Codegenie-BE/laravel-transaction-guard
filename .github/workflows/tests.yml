name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_MAX_PARALLEL_HTTP: 4

jobs:
  patch-phpstan-cleanup:
    name: Temporary PHPStan cleanup
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'hardening/post-v040-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/post-v040-audit

      - name: Apply guarded PHPStan cleanup
        run: python tools/apply-phpstan-cleanup.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Analysis/SourceScanner.php
          git commit -m 'fix: remove stale scanner context state'
          git push origin HEAD:hardening/post-v040-audit

  quality:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    needs: patch-phpstan-cleanup
    if: ${{ always() && (needs.patch-phpstan-cleanup.result == 'success' || needs.patch-phpstan-cleanup.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin Laravel test dependencies
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Run dependency-free regression matrix
        run: composer test:smoke

      - name: Run Pest suite
        run: composer test

      - name: Check formatting
        run: composer format:test

      - name: Run static analysis
        run: composer analyse

  lowest:
    name: Lowest supported dependencies
    needs: patch-phpstan-cleanup
    if: ${{ always() && (needs.patch-phpstan-cleanup.result == 'success' || needs.patch-phpstan-cleanup.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Pin lowest supported Laravel 12 test dependencies
        run: composer require --dev 'orchestra/testbench:^10.0' 'pestphp/pest:^3.0' --no-update --no-interaction

      - name: Resolve lowest supported dependency set
        run: composer update --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit lowest dependency set
        run: composer audit --no-interaction

      - name: Validate optimized autoloading
        run: composer dump-autoload --optimize --strict-psr --no-interaction

      - name: Run dependency-free regression matrix
        run: composer test:smoke

      - name: Run Pest suite on lowest dependencies
        run: composer test

      - name: Run static analysis on lowest dependencies
        run: composer analyse

  lowest-laravel13:
    name: Lowest supported Laravel 13 dependencies
    needs: patch-phpstan-cleanup
    if: ${{ always() && (needs.patch-phpstan-cleanup.result == 'success' || needs.patch-phpstan-cleanup.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Pin lowest supported Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:^11.0' 'pestphp/pest:^4.0' --no-update --no-interaction

      - name: Resolve lowest supported Laravel 13 dependency set
        run: composer update --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit lowest Laravel 13 dependency set
        run: composer audit --no-interaction

      - name: Validate optimized autoloading
        run: composer dump-autoload --optimize --strict-psr --no-interaction

      - name: Run dependency-free regression matrix
        run: composer test:smoke

      - name: Run Pest suite on lowest Laravel 13 dependencies
        run: composer test

      - name: Run static analysis on lowest Laravel 13 dependencies
        run: composer analyse

  coverage:
    name: Coverage / PHP 8.5 / Laravel 13
    needs: patch-phpstan-cleanup
    if: ${{ always() && (needs.patch-phpstan-cleanup.result == 'success' || needs.patch-phpstan-cleanup.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Pin Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:^11.0' 'pestphp/pest:^4.0' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Enforce coverage baseline
        run: composer test:coverage

  distribution:
    name: Distribution archive
    needs: patch-phpstan-cleanup
    if: ${{ always() && (needs.patch-phpstan-cleanup.result == 'success' || needs.patch-phpstan-cleanup.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Validate distribution archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          composer archive --format=zip --dir=build
          archive="$(find build -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "${archive}"

          invalid="$({
            unzip -Z1 "${archive}" | awk '
              {
                entry=$0
                if (entry == "" || entry ~ /\/$/) next
                if (entry == "composer.json" || entry == "README.md" || entry == "LICENSE.md" || entry == "CHANGELOG.md" || entry == "SECURITY.md") next
                if (entry ~ /^src\// || entry ~ /^config\//) next
                print entry
              }
            '
          } || true)"

          if [ -n "${invalid}" ]; then
            echo 'Distribution archive contains files outside the explicit allowlist:' >&2
            printf '%s\n' "${invalid}" >&2
            exit 1
          fi

  required:
    name: Tests / Required
    needs:
      - quality
      - lowest
      - lowest-laravel13
      - coverage
      - distribution
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every test job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LOWEST_RESULT: ${{ needs.lowest.result }}
          LOWEST_LARAVEL13_RESULT: ${{ needs.lowest-laravel13.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
        shell: bash
        run: |
          test "${QUALITY_RESULT}" = 'success'
          test "${LOWEST_RESULT}" = 'success'
          test "${LOWEST_LARAVEL13_RESULT}" = 'success'
          test "${COVERAGE_RESULT}" = 'success'
          test "${DISTRIBUTION_RESULT}" = 'success'
