name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  COMPOSER_MAX_PARALLEL_HTTP: 4

jobs:
  release-fix:
    name: Release readiness branch fixer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout authorized release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-readiness
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Apply release-quality fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected fragment not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/Analysis/ClassMetadataIndex.php',
              '    /** @param array<string, true> $seen @return list<string> */\n    private function inheritedInterfacesFor(string $key, array $seen): array\n',
              '    /**\n     * @param  array<string, true>  $seen\n     * @return list<string>\n     */\n    private function inheritedInterfacesFor(string $key, array $seen): array\n',
          )
          replace_once(
              'src/Analysis/Finding.php',
              "        if (is_string($cwd) && $cwd !== '') {\n",
              "        if ($cwd !== false) {\n",
          )
          replace_once(
              'src/Analysis/SourceScanner.php',
              '|| $metadata?->queueAfterCommit() === true ||',
              '|| $metadata->queueAfterCommit() === true ||',
          )
          replace_once(
              'src/Analysis/SourceScanner.php',
              '''        $flush = function () use (&$regions, &$groupStart, &$groupEnd, &$depth): void {
            if ($groupStart === null) {
                return;
            }

            $end = $groupEnd ?? strlen($this->source);
            $regions[] = [
                'start' => $groupStart['end'],
                'end' => $end,
                'line' => $this->lineAtOffset($groupStart['offset']),
                'type' => 'manual',
                'attempts' => 1,
                'callableStart' => $groupStart['end'],
                'callableEnd' => $end,
            ];

            $groupStart = null;
            $groupEnd = null;
            $depth = 0;
        };
''',
              '''        /** @param array{type:string,offset:int,end:int,scope:string}|null $start */
        $flush = function (?array $start, ?int $endOffset) use (&$regions): void {
            if ($start === null) {
                return;
            }

            $end = $endOffset ?? strlen($this->source);
            $regions[] = [
                'start' => $start['end'],
                'end' => $end,
                'line' => $this->lineAtOffset($start['offset']),
                'type' => 'manual',
                'attempts' => 1,
                'callableStart' => $start['end'],
                'callableEnd' => $end,
            ];
        };
''',
          )
          replace_once(
              'src/Analysis/SourceScanner.php',
              '''            if ($groupStart !== null && $call['scope'] !== $groupStart['scope']) {
                $flush();
            }
''',
              '''            if ($groupStart !== null && $call['scope'] !== $groupStart['scope']) {
                $flush($groupStart, $groupEnd);
                $groupStart = null;
                $groupEnd = null;
                $depth = 0;
            }
''',
          )
          replace_once(
              'src/Analysis/SourceScanner.php',
              '''                if ($groupStart !== null && $depth === 0) {
                    $flush();
                }
''',
              '''                if ($groupStart !== null && $depth === 0) {
                    $flush($groupStart, $groupEnd);
                    $groupStart = null;
                    $groupEnd = null;
                    $depth = 0;
                }
''',
          )
          replace_once(
              'src/Analysis/SourceScanner.php',
              '        $flush();\n\n        return $regions;\n',
              '        $flush($groupStart, $groupEnd);\n\n        return $regions;\n',
          )
          replace_once(
              'src/Analysis/SourceScanner.php',
              '    /** @param list<Finding> $findings */\n    private function appendFinding(\n',
              '    /**\n     * @param  list<Finding>  $findings\n     * @param  array<string, scalar|null>  $context\n     */\n    private function appendFinding(\n',
          )
          replace_once(
              'src/Analysis/SourceScanner.php',
              '    /** @param list<Finding> $findings @param array{attempts:int,type:string} $tx */\n    private function appendRetryFinding(',
              '    /**\n     * @param  list<Finding>  $findings\n     * @param  array{attempts:int,type:string}  $tx\n     */\n    private function appendRetryFinding(',
          )
          replace_once(
              'src/Console/TransactionGuardCommand.php',
              "        $format = strtolower((string) $this->option('format'));\n",
              "        $formatOption = $this->option('format');\n        $format = is_string($formatOption) ? strtolower($formatOption) : 'console';\n",
          )
          replace_once(
              'src/Analysis/AnalysisConfig.php',
              '''        foreach ($this->customSideEffectPatterns as $pattern) {
            if (@preg_match($pattern, '') === false) {
                throw new \\InvalidArgumentException("Invalid custom side-effect regular expression [{$pattern}].");
            }
        }
''',
              '''        foreach ($this->customSideEffectPatterns as $pattern) {
            set_error_handler(static fn (): bool => true);
            try {
                $valid = preg_match($pattern, '') !== false;
            } finally {
                restore_error_handler();
            }

            if (! $valid) {
                throw new \\InvalidArgumentException("Invalid custom side-effect regular expression [{$pattern}].");
            }
        }
''',
          )
          PY

          rm -f .github/workflows/release-readiness-fix.yml

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Apply Pint
        run: composer format

      - name: Run PHPStan
        run: composer analyse

      - name: Run smoke regression matrix
        run: composer test:smoke

      - name: Run Pest suite
        run: composer test

      - name: Enforce coverage baseline
        run: composer test:coverage

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/Analysis/ClassMetadataIndex.php src/Analysis/Finding.php src/Analysis/SourceScanner.php src/Analysis/AnalysisConfig.php src/Console/TransactionGuardCommand.php
          git add -u -- .github/workflows/release-readiness-fix.yml
          if git diff --cached --quiet; then
            echo 'No validated changes to commit.'
            exit 0
          fi
          git commit -m 'fix: satisfy release quality gates'
          git push origin HEAD:fix/release-readiness

  quality:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin Laravel test dependencies
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Run dependency-free regression matrix
        run: composer test:smoke

      - name: Run Pest suite
        run: composer test

      - name: Check formatting
        run: composer format:test

      - name: Run static analysis
        run: composer analyse

  coverage:
    name: Coverage / PHP 8.5 / Laravel 13
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Pin Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:^11.0' 'pestphp/pest:^4.0' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Enforce coverage baseline
        run: composer test:coverage
