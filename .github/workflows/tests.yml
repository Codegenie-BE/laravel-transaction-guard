name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_MAX_PARALLEL_HTTP: 4

jobs:
  v040_writer:
    name: Validate and write v0.4.0 hardening
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'release/v0.4.0-hardening' &&
      github.event.pull_request.head.sha == '18ee8e4c97ed1c5f13024d518614c8ff591c0961'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.4.0-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Apply v0.4.0 patch
        run: python3 tools/v040_patch.py

      - name: Lint source
        run: find src tests tools -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Format
        run: composer format

      - name: Run complete quality gate
        run: composer check:all

      - name: Enforce coverage
        run: composer test:coverage

      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/tests.yml' ':!.github/workflows/v040-maintenance.yml'
          git commit -m 'release: v0.4.0 transaction lifecycle hardening'
          git push origin HEAD:release/v0.4.0-hardening

  quality:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin Laravel test dependencies
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Run dependency-free regression matrix
        run: composer test:smoke

      - name: Run Pest suite
        run: composer test

      - name: Check formatting
        run: composer format:test

      - name: Run static analysis
        run: composer analyse

  lowest:
    name: Lowest supported dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Pin lowest supported Laravel 12 test dependencies
        run: composer require --dev 'orchestra/testbench:^10.0' 'pestphp/pest:^3.0' --no-update --no-interaction

      - name: Resolve lowest supported dependency set
        run: composer update --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit lowest dependency set
        run: composer audit --no-interaction

      - name: Validate optimized autoloading
        run: composer dump-autoload --optimize --strict-psr --no-interaction

      - name: Run dependency-free regression matrix
        run: composer test:smoke

      - name: Run Pest suite on lowest dependencies
        run: composer test

      - name: Run static analysis on lowest dependencies
        run: composer analyse

  coverage:
    name: Coverage / PHP 8.5 / Laravel 13
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Pin Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:^11.0' 'pestphp/pest:^4.0' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Enforce coverage baseline
        run: composer test:coverage
