name: V0.2 analyzer hardening

on:
  push:
    branches:
      - feature/v0.2-analyzer-hardening

permissions:
  contents: write

concurrency:
  group: v02-analyzer-hardening
  cancel-in-progress: false

jobs:
  refactor:
    name: Apply and validate v0.2 hardening
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/v0.2-analyzer-hardening
          fetch-depth: 0

      - name: Apply deterministic refactors
        run: |
          python3 .github/refactor-v02-metadata.py
          python3 .github/refactor-v02-scanner.py
          python3 .github/refactor-v02-tests.py

      - name: Commit transformed sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src tests tools docs README.md CHANGELOG.md composer.json phpstan.neon
          if ! git diff --cached --quiet; then
            git commit -m 'feat: harden analyzer performance and coverage'
            git push origin HEAD:feature/v0.2-analyzer-hardening
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Apply Pint
        run: composer format

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src tests tools docs README.md CHANGELOG.md composer.json phpstan.neon; then
            exit 0
          fi
          git add -- src tests tools docs README.md CHANGELOG.md composer.json phpstan.neon
          git commit -m 'style: format v0.2 analyzer hardening'
          git push origin HEAD:feature/v0.2-analyzer-hardening

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Run expanded smoke matrix
        run: composer test:smoke

      - name: Run Pest suite
        run: composer test

      - name: Verify formatting
        run: composer format:test

      - name: Run PHPStan level 8
        run: composer analyse

      - name: Enforce coverage baseline
        run: composer test:coverage

      - name: Run informational analyzer benchmark
        run: composer benchmark
